[workspace]
resolver = "2"

members = [
    "crates/zuva_core",
    "crates/zuva_frontend",
    "crates/zuva_semantic",
    "crates/zuva_vm",
    "crates/zuva_driver",
    "crates/zuva_cli",
    "tools/xtask",
    "benchmarks",
]

default-members = [
    "crates/zuva_cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Zuva Language Project"]
repository = "https://github.com/your-organisation/zuva"
homepage = "https://github.com/your-organisation/zuva"
documentation = "https://github.com/your-organisation/zuva/tree/main/docs"

[workspace.dependencies]
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
clap = { version = "4", features = ["derive"] }
rustyline = "15"

indexmap = "2"
smallvec = "1"
smol_str = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

insta = "1"
pretty_assertions = "1"
criterion = "0.5"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"